# ==========================
# Development Environment
# ==========================

app:
  app-url: "http://localhost:3000"
  cookie-secure: false
  control-panel:
    enabled: true
    title: micro-panel
    path: /control-panel
    log-url: true

micronaut:
  server:
    cors:
      enabled: true
      configurations:
        web:
          allowedOrigins: "http://localhost:3000" 
    multipart:
      max-file-size: 10
      max-request-size: 52MB

    router:
      static-resources:
        swagger:
          paths: classpath:META-INF/swagger
          mapping: /swagger/**
        swagger-ui:
          paths: classpath:META-INF/swagger/views/swagger-ui
          mapping: /api-docs/**
        swagger-ui-default:
          paths: classpath:META-INF/swagger/views/swagger-ui
          mapping: /swagger-ui/**

  security:
    intercept-url-map:
      -
        pattern: /control-panel
        access:
          - isAnonymous()
      -
        pattern: /control-panel/*
        access:
          - isAnonymous()

# ==========================
# Development Infrastructure
# ==========================
datasources:
  default:
    url: ${DATASOURCE_URL:-jdbc:postgresql://localhost:5432/microsample}
    username: ${DATASOURCE_USERNAME:-micro_infra}
    password: ${DATASOURCE_PASSWORD}
    driverClassName: org.postgresql.Driver
    dialect: POSTGRES
    schema: microsample
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      auto-commit: true

nats:
  default:
    addresses:
      - ${NATS_URL:-nats://localhost:4222}
    username: ${NATS_USERNAME:-microsample-system-1}
    password: ${NATS_PASSWORD}

redis:
  uri: ${REDIS_URI}

storage:
  s3:
    bucket: ${S3_BUCKET:-test-bucket}

# ==========================
# Development Settings
# ==========================
jimmer:
  show-sql: true

# ==========================
# Development Logging
# ==========================
logger:
  levels:
    ROOT: TRACE
    io.micronaut: INFO
    io.netty: ALL
    io.micronaut.http.server.netty: ALL
    io.micronaut.context: WARN
    org.flywaydb: INFO
    io.micronaut.flyway: INFO
    org.babyfish.jimmer.sql: TRACE

endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    details-visible: ANONYMOUS
  loggers:
    write-sensitive: false
