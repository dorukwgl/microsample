# ==========================
# Development Environment
# ==========================

app:
  app-url: "http://localhost:3000"
  cookie-secure: false
  control-panel:
    enabled: true
    title: micro-panel
    path: /control-panel
    log-url: true

micronaut:
  server:
    cors:
      enabled: true
      configurations:
        web:
          allowedOrigins: "http://localhost:3000" 
    multipart:
      max-file-size: 10
      max-request-size: 52MB

  security:
    intercept-url-map:
      -
        pattern: /control-panel
        access:
          - isAnonymous()
      -
        pattern: /control-panel/*
        access:
          - isAnonymous()

# ==========================
# Development Infrastructure
# ==========================
datasources:
  default:
    url: jdbc:postgresql://localhost:5432/microsample
    username: doruk
    password: dorukdb
    driverClassName: org.postgresql.Driver
    dialect: POSTGRES
    schema: microsample
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      auto-commit: true

nats:
  default:
    addresses:
      - "nats://localhost:4222"
    username: microsample-system-sysid-1
    password: ${NATS_PASSWORD}

redis:
  uri: "redis://localhost"

storage:
  s3:
    bucket: test-bucket

# ==========================
# Development Settings
# ==========================
jimmer:
  show-sql: true

# ==========================
# Development Logging
# ==========================
logger:
  levels:
    ROOT: TRACE
    io.micronaut: INFO
    io.netty: ALL
    io.micronaut.http.server.netty: ALL
    io.micronaut.context: WARN
    org.flywaydb: INFO
    io.micronaut.flyway: INFO
    org.babyfish.jimmer.sql: TRACE

endpoints:
  all:
    enabled: true
    sensitive: false
  health:
    details-visible: ANONYMOUS
  loggers:
    write-sensitive: false
