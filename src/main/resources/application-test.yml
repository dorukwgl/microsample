# ==========================
# Test Environment
# ==========================

micronaut:
  server:
    port: ${TEST_PORT:-9097}
    multipart:
      max-file-size: 10
      max-request-size: 52MB
    netty:
      event-loops:
        default:
          loom-carrier: true
    thread-selection: blocking
    context-path: /app

  security:
    enabled: false
    intercept-url-map:
      - pattern: /**
        access:
          - isAnonymous()

  executors:
    cpu-executor:
      type: fixed
      n-threads: 2

datasources:
  default:
    url: ${TEST_DATASOURCE_URL:-jdbc:postgresql://localhost:5432/microsample_test}
    username: ${TEST_DATASOURCE_USERNAME:-doruk}
    password: ${TEST_DATASOURCE_PASSWORD:-dorukdb}
    schema: microsample
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

flyway:
  datasources:
    default:
      schemas: microsample

jimmer:
  show-sql: true

nats:
  default:
    addresses:
      - ${TEST_NATS_URL:-nats://localhost:4222}

redis:
  uri: ${TEST_REDIS_URL:-redis://localhost}

storage:
  s3:
    bucket: test-bucket

# ==========================
# Test Logging
# ==========================
logger:
  levels:
    ROOT: WARN
    io.micronaut: INFO
    org.flywaydb: INFO
    io.micronaut.flyway: INFO
    org.babyfish.jimmer.sql: WARN

kind: Application
