# ==========================
# Common Application Configuration
# ==========================

micronaut:
  application:
    name: microsample
    app-id: ${APP_ID}
    session-expiration: ${SESSION_EXPIRATION:7} # days
    image-max-size: 5242880 # 5MB
    license-server-private-key: ${LICENSE_SERVER_PRIVATE_KEY}
    license-server-public-key: ${LICENSE_SERVER_PUBLIC_KEY}
    app-url: ${APP_URL}

  security:
    enabled: true
    reject-not-found: false
    redirect:
      enabled: false
    token:
      jwt:
        enabled: true
        signatures:
          jwks:
            local-signer:
              url: http://localhost:41518/.well-known/jwks.json
              cache-expiration: 3600
        claims-validators:
          audience: ${APP_ID}
          issuer: com.doruk.jwks
    authentication: bearer
    oauth2:
      clients:
        google:
          client-id: ${GOOGLE_CLIENT_ID}
          client-secret: ${GOOGLE_CLIENT_SECRET}
          openid:
            issuer: https://accounts.google.com
          authorization:
            url: https://accounts.google.com/o/oauth2/auth
          token:
            url: https://oauth2.googleapis.com/token
          redirect-uri: ${APP_URL}"/auth/oauth/google/callback"

  executors:
    cpu-executor:
      type: fixed
      n-threads: 4

  server:
    proxy:
      enabled: true
    cors:
      enabled: true
      configurations:
        web:
          allowedOrigins: "http://localhost:3000"
    dispatch-options-requests: true
    netty:
      use-native-transport: true
      user-forwarded-headers: true

      listeners:
        http2Listener:
          port: ${LEDGER_PORT}
      event-loops:
        default:
          prefer-native-transport: true
          transport: io_uring
          loom-carrier: true  # for loom carrier

      default-bootstrap:
      event-loop-shutdown-quiet-period: 0ms
      event-loop-shutdown-timeout: 0ms

    thread-selection: blocking # for loom carrier

  http:
    client:
      event-loop-group: default # for loom carrier
      pool:
        connection-locality: enforced_always # for loom carrier
    services:
      jwks:
        url: http://localhost:41518
      brevo:
        url: ${brevo.url}
      sociair:
        url: https://sms.sociair.com

  router:
    static-resources:
      swagger:
        paths: classpath:META-INF/swagger
        mapping: /swagger/**
      swagger-ui:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /api-docs/**
      swagger-ui-default:
        paths: classpath:META-INF/swagger/views/swagger-ui
        mapping: /swagger-ui/**

# ==========================
# Database Configuration
# ==========================
datasources:
  default:
    url: jdbc:${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driverClassName: org.postgresql.Driver
    dialect: POSTGRES
    schema: microsample

    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      auto-commit: true

jimmer:
  dialect: postgres

nats:
  default:
    addresses:
      - "nats://localhost:4222"
    username: microsample-system-sysid-1
    password: ${NATS_PASSWORD}

redis:
  uri: "redis://localhost"

brevo:
  url: https://api.brevo.com
  apiKey: ${BREVO_API_KEY}
  senderEmail: ${BREVO_SENDER_EMAIL}
  senderName: ${BREVO_SENDER_NAME}

# ==========================
# Firebase Cloud Messaging
# ==========================
# Generate service account JSON: Firebase Console → Project Settings → Service Accounts → Generate New Private Key
# Copy the entire JSON content into the FIREBASE_SERVICE_ACCOUNT_JSON env var.
firebase:
  service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON}

# ==========================
# Flyway Migration Settings
# ==========================

flyway:
  datasources:
    default:
      enabled: true
      validate-on-migrate: true
      baseline-on-migrate: true
      baseline-description: "Initial migration"
      out-of-order: false
      locations: classpath:db/migration
      schemas: sample

# ==================================
# S3 Storage Configuration
# ==================================
storage:
  s3:
    bucket: test-bucket
    public-base-url: https://cdn.example.com
    region: auto
    endpoint: https://<account-id>.r2.cloudflarestorage.com
    access-key: ${R2_ACCESS_KEY}
    secret-key: ${R2_SECRET_KEY}

kind: Application
