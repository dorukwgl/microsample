# ==========================
# Production Environment
# ==========================

app:
  cookie-secure: true

micronaut:
  server:
    cors:
      enabled: true
      configurations:
        web:
          allowedOrigins: ${CORS_ORIGINS}

# ==========================
# Production Infrastructure
# ==========================
datasources:
  default:
    url: jdbc:${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}
    driverClassName: org.postgresql.Driver
    dialect: POSTGRES
    schema: microsample
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      auto-commit: true

nats:
  default:
    addresses:
      - ${NATS_URL}
    username: ${NATS_USERNAME}
    password: ${NATS_PASSWORD}

redis:
  uri: ${REDIS_URL}

storage:
  s3:
    bucket: ${S3_BUCKET}

# ==========================
# Production Settings
# ==========================
jimmer:
  show-sql: false

# ==========================
# Production Logging
# ==========================
logger:
  levels:
    ROOT: INFO
    io.micronaut: INFO
    io.netty: WARN
    io.micronaut.http.server.netty: INFO
    io.micronaut.context: WARN
    org.flywaydb: INFO
    io.micronaut.flyway: INFO
    org.babyfish.jimmer.sql: WARN
