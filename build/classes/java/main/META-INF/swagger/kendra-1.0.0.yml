openapi: 3.0.1
info:
  title: Kendra
  version: 1.0.0
tags:
- name: User Management
  description: User registration and profile management
- name: Organization Management
  description: Organization CRUD and member management
paths:
  /app/admin/key-pair:
    get:
      operationId: generateKeyPair
      responses:
        "200":
          description: generateKeyPair 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KeyPairDto"
      security:
      - Authorization: []
  /app/admin/licenses/grant:
    post:
      operationId: grantLicense
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantLicenseRequest"
        required: true
      responses:
        "201":
          description: grantLicense 201 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/admin/licenses/{licenseId}/reactivate:
    patch:
      operationId: reactivateLicense
      parameters:
      - name: licenseId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: reactivateLicense 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/admin/licenses/{licenseId}/revoke:
    patch:
      operationId: revokeLicense
      parameters:
      - name: licenseId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: revokeLicense 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/admin/licenses/{licenseId}/suspend:
    patch:
      operationId: suspendLicense
      parameters:
      - name: licenseId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: suspendLicense 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/admin/orgs/{orgId}/licenses:
    get:
      operationId: getOrgLicenses
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/PageQueryRequest"
      responses:
        "200":
          description: getOrgLicenses 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse_LicenseResponse_"
      security:
      - Authorization: []
  /app/admin/product-servers:
    get:
      operationId: listProductServers
      parameters:
      - name: page
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/PageQueryRequest"
      - name: name
        in: query
        explode: false
        schema:
          type: string
          nullable: true
      responses:
        "200":
          description: listProductServers 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse_ProductServerResponse_"
      security:
      - Authorization: []
    post:
      summary: "# Manual License Operations POST /admin/licenses/grant manually create\
        \ license (bypass billing) PATCH /admin/licenses/:licenseId/revoke revoke\
        \ PATCH /admin/licenses/:licenseId/suspend suspend (new status) PATCH /admin/licenses/:licenseId/reactivate\
        \ # Considerations Most operations are already implemented, so reuse them\
        \ while grant license: call existing payment completed methods which also\
        \ fires webhook same with any license operations: as this is just plugin point\
        \ for admin manual control bypassing billing"
      description: "# Manual License Operations POST /admin/licenses/grant manually\
        \ create license (bypass billing) PATCH /admin/licenses/:licenseId/revoke\
        \ revoke PATCH /admin/licenses/:licenseId/suspend suspend (new status) PATCH\
        \ /admin/licenses/:licenseId/reactivate # Considerations Most operations are\
        \ already implemented, so reuse them while grant license: call existing payment\
        \ completed methods which also fires webhook same with any license operations:\
        \ as this is just plugin point for admin manual control bypassing billing"
      operationId: createProductServer
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductServerRequest"
        required: true
      responses:
        "201":
          description: createProductServer 201 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductServerResponse"
      security:
      - Authorization: []
  /app/admin/product-servers/{skuId}:
    delete:
      operationId: deleteProductServer
      parameters:
      - name: skuId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: deleteProductServer 200 response
      security:
      - Authorization: []
  /app/auth/email/init-verification:
    post:
      tags:
      - Authentications
      operationId: initEmailVerification
      responses:
        "202":
          description: initEmailVerification 202 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      security:
      - Authorization: []
  /app/auth/email/verify-magic/{magicLink}:
    get:
      tags:
      - Authentications
      operationId: verifyEmailViaMagicLink
      parameters:
      - name: magicLink
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: verifyEmailViaMagicLink 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
  /app/auth/email/verify-otp/{transactionId}:
    post:
      tags:
      - Authentications
      operationId: verifyEmailOtp
      parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: integer
              format: int32
        required: true
      responses:
        "200":
          description: verifyEmailOtp 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/auth/fa/disable:
    post:
      tags:
      - Authentications
      description: Disable MFA
      operationId: disableMultiFactorAuthorization
      requestBody:
        content:
          application/json:
            schema:
              maxLength: 50
              type: string
        required: true
      responses:
        "200":
          description: disableMultiFactorAuthorization 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/auth/forgot-password/init:
    post:
      tags:
      - Authentications
      description: Initiate password reset
      operationId: initPasswordReset
      parameters:
      - name: usePhone
        in: query
        explode: false
        schema:
          type: boolean
          default: false
      requestBody:
        content:
          application/json:
            schema:
              maxLength: 500
              type: string
        required: true
      responses:
        "200":
          description: initPasswordReset 200 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      security:
      - Authorization: []
  /app/auth/forgot-password/verify-update-magic/{magic}:
    get:
      tags:
      - Authentications
      description: Returns the password reset page for given magic link
      operationId: getMagicPasswordResetPage
      parameters:
      - name: magic
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getMagicPasswordResetPage 200 response
          content:
            text/html:
              schema:
                type: string
      security:
      - Authorization: []
    post:
      tags:
      - Authentications
      description: Update password via given reset link
      operationId: verifyAndUpdatePasswordMagic
      parameters:
      - name: magic
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              maxLength: 25
              minLength: 8
              type: string
        required: true
      responses:
        "200":
          description: verifyAndUpdatePasswordMagic 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/auth/forgot-password/verify-update-otp/{tid}:
    put:
      tags:
      - Authentications
      description: Verify the otp and update the password
      operationId: verifyAndUpdatePassword
      parameters:
      - name: tid
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              maxLength: 35
              minLength: 8
              type: string
              format: int32
        required: true
      responses:
        "200":
          description: verifyAndUpdatePassword 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/auth/login:
    post:
      tags:
      - Authentications
      operationId: login
      parameters:
      - name: X-Device-Id
        in: header
        schema:
          maxLength: 200
          minLength: 32
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          nullable: true
      - name: User-Agent
        in: header
        required: false
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
        required: true
      responses:
        "201":
          description: Login successful
        "202":
          description: Multi factor authentication required
  /app/auth/mfa/enable/{auth}:
    post:
      tags:
      - Authentications
      description: Enable Multi Factor Authorixation (MFA)
      operationId: enableMultiFactorAuthorization
      parameters:
      - name: auth
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/MultiAuthType"
      responses:
        "200":
          description: enableMultiFactorAuthorization 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/auth/mfa/verify/{mfaToken}:
    post:
      tags:
      - Authentications
      operationId: verifyMfa
      parameters:
      - name: X-Device-Id
        in: header
        schema:
          maxLength: 200
          minLength: 32
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          nullable: true
      - name: User-Agent
        in: header
        required: false
        schema:
          minLength: 1
          type: string
      - name: mfaToken
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                otp:
                  maximum: 999999
                  minimum: 100000
                  type: integer
                  format: int32
                  x-maximum-message: OTP must be 6 digits
                  x-minimum-message: OTP must be 6 digits
        required: true
      responses:
        "200":
          description: verifyMfa 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /app/auth/password:
    put:
      tags:
      - Authentications
      description: Change Password
      operationId: changePassword
      requestBody:
        content:
          application/json:
            schema:
              maxLength: 50
              minLength: 8
              type: string
        required: true
      responses:
        "200":
          description: changePassword 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
  /app/auth/phone/init-verification:
    post:
      tags:
      - Authentications
      operationId: initPhoneVerification
      responses:
        "202":
          description: initPhoneVerification 202 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      security:
      - Authorization: []
  /app/auth/phone/verify-otp/{transactionId}:
    post:
      tags:
      - Authentications
      operationId: verifyPhoneNumber
      parameters:
      - name: transactionId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: integer
              format: int32
        required: true
      responses:
        "200":
          description: verifyPhoneNumber 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/auth/session/list:
    get:
      tags:
      - Authentications
      description: View the list of logged in devices
      operationId: listSessions
      responses:
        "200":
          description: listSessions 200 response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionDto"
      security:
      - Authorization: []
  /app/auth/session/logout:
    delete:
      tags:
      - Authentications
      description: Sign Out from current device
      operationId: logout
      parameters:
      - name: X-State-Transfer
        in: cookie
        required: true
        schema:
          type: string
      responses:
        "200":
          description: logout 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
  /app/auth/session/logout-all:
    delete:
      tags:
      - Authentications
      description: Sign Out from all devices
      operationId: logoutAll
      parameters:
      - name: biometric
        in: query
        description: "Also removes the biometrics data, if set to true"
        explode: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: logoutAll 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
  /app/auth/session/logout-others:
    delete:
      tags:
      - Authentications
      description: "Sign Out from other logged in devices, except the current one."
      operationId: logoutOthers
      parameters:
      - name: X-State-Transfer
        in: cookie
        required: true
        schema:
          type: string
      - name: biometric
        in: query
        description: "Also removes the biometrics data, if set to true"
        explode: false
        schema:
          type: boolean
          default: false
      responses:
        "200":
          description: logoutOthers 200 response
          content:
            application/json:
              schema:
                type: object
      security:
      - Authorization: []
  /app/auth/session/refresh:
    get:
      tags:
      - Authentications
      operationId: refreshAccessToken
      parameters:
      - name: X-State-Transfer
        in: cookie
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Access token refreshed successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JwtResponse"
        "401":
          description: Invalid or expired session. Please login again.
  /app/auth/update/email:
    put:
      tags:
      - Authentications
      description: Update the existing email address
      operationId: updateEmail
      requestBody:
        content:
          application/json:
            schema:
              required:
              - email
              type: object
              properties:
                email:
                  minLength: 1
                  type: string
                  format: email
        required: true
      responses:
        "200":
          description: When existing email address is not verified.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUpdateResponse"
        "202":
          description: When existing email address is verified.
      security:
      - Authorization: []
  /app/auth/update/email/verify:
    put:
      tags:
      - Authentications
      description: Verify the update email transaction. Second step of the route /update/email
      operationId: verifyUpdateEmail
      requestBody:
        content:
          application/json:
            schema:
              maxLength: 80
              type: integer
              format: int32
        required: true
      responses:
        "200":
          description: verifyUpdateEmail 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/auth/update/phone:
    put:
      tags:
      - Authentications
      description: Update existing or add new phone number
      operationId: updatePhone
      requestBody:
        content:
          application/json:
            schema:
              required:
              - phone
              type: object
              properties:
                phone:
                  minLength: 1
                  pattern: |
                    ^\+?\d{6,14}$
                  type: string
        required: true
      responses:
        "200":
          description: When existing phone number is not verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUpdateResponse"
        "202":
          description: When existing phone number is verified
      security:
      - Authorization: []
  /app/auth/update/phone/verify:
    put:
      tags:
      - Authentications
      description: Verify the update phone transaction. Second step of the route /update/phone
      operationId: verifyUpdatePhone
      requestBody:
        content:
          application/json:
            schema:
              maxLength: 80
              type: integer
              format: int32
        required: true
      responses:
        "200":
          description: verifyUpdatePhone 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/biometrics/enroll:
    post:
      description: Setup the biometric authentication
      operationId: enrollBiometrics
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiometricEnrollRequest"
        required: true
      responses:
        "200":
          description: enrollBiometrics 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InfoResponse"
      security:
      - Authorization: []
  /app/biometrics/perform/init:
    post:
      description: Initiate the biometric verification challenge
      operationId: initBiometrics
      requestBody:
        content:
          application/json:
            schema:
              maxLength: 72
              minLength: 64
              type: string
        required: true
      responses:
        "200":
          description: initBiometrics 200 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
      security:
      - Authorization: []
  /app/biometrics/perform/verify:
    post:
      description: "Second step to the biometric, sign the challenge and submit the\
        \ signature here to verify"
      operationId: performBiometrics
      parameters:
      - name: X-Device-Id
        in: header
        schema:
          maxLength: 200
          minLength: 32
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          type: string
          nullable: true
      - name: User-Agent
        in: header
        required: false
        schema:
          minLength: 1
          type: string
      requestBody:
        content:
          application/json:
            schema:
              required:
              - challenge
              - deviceId
              - signature
              type: object
              properties:
                deviceId:
                  minLength: 1
                  type: string
                  description: "Biometric device identifier, the one sent during biometric\
                    \ enrollment"
                challenge:
                  minLength: 1
                  type: string
                  description: The challenge sent during biometric initiation.
                signature:
                  minLength: 1
                  type: string
                  description: Base64 URL encoded (without padding) string value of
                    the SHA256withECDSA signature bytes
        required: true
      responses:
        "200":
          description: performBiometrics 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
      security:
      - Authorization: []
  /app/interop/license/{userId}/{skuId}:
    get:
      operationId: getLicenseInfo
      parameters:
      - name: userId
        in: path
        required: true
        schema:
          minLength: 1
          type: string
          format: uuid
      - name: skuId
        in: path
        description: SKU identifier for the license. Product SKU. Do not confuse for
          addon sku
        required: true
        schema:
          minLength: 1
          type: string
          format: uuid
      responses:
        "200":
          description: getLicenseInfo 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LicenseInfoResponse"
  /app/licenses:
    get:
      tags:
      - Licenses
      summary: Get all active licenses of organization
      operationId: getLicenses
      parameters:
      - name: req
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/PageQueryRequest"
      responses:
        "200":
          description: getLicenses 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse_LicenseResponse_"
      security:
      - Authorization: []
  /app/licenses/{licenseKey}/seats:
    get:
      tags:
      - Licenses
      summary: List all seats for a license
      operationId: listSeats
      parameters:
      - name: licenseKey
        in: path
        required: true
        schema:
          type: string
      - name: req
        in: query
        required: true
        explode: false
        schema:
          $ref: "#/components/schemas/PageQueryRequest"
      responses:
        "200":
          description: listSeats 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageResponse_SeatDto_"
      security:
      - Authorization: []
    post:
      tags:
      - Licenses
      summary: Assign a seat to a user
      operationId: assignSeat
      parameters:
      - name: licenseKey
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssignSeatRequest"
        required: true
      responses:
        "200":
          description: assignSeat 200 response
      security:
      - Authorization: []
  /app/licenses/{licenseKey}/seats/{userId}:
    delete:
      tags:
      - Licenses
      summary: Revoke a seat from a user
      operationId: revokeSeat
      parameters:
      - name: licenseKey
        in: path
        required: true
        schema:
          type: string
      - name: userId
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        "200":
          description: revokeSeat 200 response
      security:
      - Authorization: []
  /app/organizations:
    put:
      tags:
      - Organization Management
      summary: Update organization name
      description: Updates organization name. Only organization admins can perform
        this operation. Personal organizations cannot be edited.
      operationId: updateMyOrganization
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationUpdateRequest"
        required: true
      responses:
        "200":
          description: updateMyOrganization 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInfoDto"
      security:
      - Authorization: []
  /app/organizations/find/{code}:
    get:
      tags:
      - Organization Management
      summary: Search organization by code
      description: Public endpoint to find an organization by its unique code. Returns
        basic organization information. Used for organization discovery and invitation
        links.
      operationId: getOrganizationByCode
      parameters:
      - name: code
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: getOrganizationByCode 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInfoDto"
      security:
      - Authorization: []
  /app/organizations/invite:
    post:
      tags:
      - Organization Management
      summary: Send organization invitation
      description: |
        Sends an email invitation to join the organization.
        Requirements:
        - Only organization admins can send invitations
        - Invite contains a link to the public organization search
        - Recipient must register and manually join using the code
      operationId: sendInvite
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrganizationInviteRequest"
        required: true
      responses:
        "200":
          description: sendInvite 200 response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OrganizationInviteResponseDto"
      security:
      - Authorization: []
  /app/organizations/leave:
    delete:
      tags:
      - Organization Management
      summary: Leave current organization
      description: |
        Allows an enterprise user to leave their current organization.
